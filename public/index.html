<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Inventory System — TRANSSION</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f6fa;min-height:100vh;font-size:14px}
.header{background:#1a73e8;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.header h1{font-size:17px;font-weight:500}
.header .sub{font-size:12px;opacity:.8}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:none;align-items:center;gap:4px}
.back-btn.show{display:flex}
.container{max-width:900px;margin:0 auto;padding:16px}
/* Cards */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e8eaed;cursor:pointer;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.1)}
.card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:500;color:#1a1a2e;margin-bottom:4px}
.card-desc{font-size:12px;color:#888;line-height:1.4}
.c-blue{background:#e8f0fe}.c-green{background:#e6f4ea}.c-orange{background:#fef3e2}
.c-purple{background:#f3e8fd}.c-red{background:#fce8e6}.c-teal{background:#e6f7f5}
/* Status bar */
.status-bar{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:16px;border:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between}
.status-name{font-weight:500;color:#1a1a2e;font-size:15px}
.status-info{font-size:12px;color:#666;margin-top:2px}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-admin{background:#e8f0fe;color:#1a73e8}
.badge-tl{background:#e6f4ea;color:#137333}
.badge-inv{background:#fef3e2;color:#b45309}
.badge-emp{background:#f3e8fd;color:#7c3aed}
.logout-btn{font-size:12px;color:#1a73e8;background:none;border:none;cursor:pointer;margin-left:10px}
/* Login */
.login-wrap{max-width:400px;margin:40px auto}
.welcome-box{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #e8eaed;text-align:center}
.welcome-box h2{font-size:18px;font-weight:500;color:#1a1a2e;margin-bottom:6px}
.welcome-box p{font-size:13px;color:#666}
.login-box{background:#fff;border-radius:12px;padding:24px;border:1px solid #e8eaed}
.login-box h2{font-size:16px;font-weight:500;margin-bottom:16px;color:#1a1a2e}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#444;margin-bottom:6px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:14px;outline:none;transition:border-color .2s;background:#fff;color:#1a1a2e}
.form-group input,.form-group select{height:40px}
.form-group textarea{padding:10px 12px;resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#1a73e8}
.btn{height:42px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;padding:0 20px}
.btn:hover{background:#1557b0}
.btn:disabled{background:#aaa;cursor:not-allowed}
.btn-full{width:100%}
.btn-outline{background:#fff;color:#1a73e8;border:1px solid #1a73e8}
.btn-outline:hover{background:#e8f0fe}
.btn-danger{background:#d93025}
.btn-danger:hover{background:#b52a21}
.btn-sm{height:32px;font-size:12px;padding:0 12px}
.btn-green{background:#137333}
.btn-green:hover{background:#0d5c28}
/* Error/Success */
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.alert-error{background:#fce8e6;color:#c62828;display:block}
.alert-success{background:#e6f4ea;color:#137333;display:block}
/* Table */
.table-wrap{background:#fff;border-radius:12px;border:1px solid #e8eaed;overflow:hidden;margin-bottom:16px}
.table-header{padding:14px 18px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-title{font-size:15px;font-weight:500;color:#1a1a2e}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fa;color:#666;font-weight:500;padding:10px 14px;text-align:left;border-bottom:1px solid #e8eaed;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0;color:#1a1a2e;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.status-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500}
.pill-new{background:#e8f0fe;color:#1a73e8}
.pill-available{background:#e6f4ea;color:#137333}
.pill-assigned{background:#fef3e2;color:#b45309}
.pill-returned{background:#e8f0fe;color:#1557b0}
.pill-damaged{background:#fce8e6;color:#c62828}
.pill-scrapped{background:#f1f3f4;color:#666}
.pill-pending{background:#fef3e2;color:#b45309}
.pill-approved{background:#e6f4ea;color:#137333}
.pill-rejected{background:#fce8e6;color:#c62828}
/* Search */
.search-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-input{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px;outline:none;min-width:180px;flex:1}
.search-input:focus{border-color:#1a73e8}
.filter-select{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:13px;outline:none;background:#fff}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #e8eaed}
.stat-label{font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:24px;font-weight:500;color:#1a1a2e}
.stat-sub{font-size:11px;color:#aaa;margin-top:2px}
/* Upload */
.upload-zone{border:2px dashed #ddd;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:border-color .2s;background:#fafafa}
.upload-zone:hover{border-color:#1a73e8}
.upload-zone.drag{border-color:#1a73e8;background:#e8f0fe}
.upload-icon{font-size:40px;margin-bottom:12px}
.upload-text{font-size:15px;font-weight:500;color:#1a1a2e;margin-bottom:6px}
.upload-sub{font-size:13px;color:#888}
/* Page */
.page{display:none}
.page.active{display:block}
.page-title{font-size:17px;font-weight:500;color:#1a1a2e;margin-bottom:16px}
.section-title{font-size:12px;font-weight:500;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
/* Empty */
.empty{text-align:center;padding:40px;color:#aaa;font-size:13px}
/* Loading */
.loading{text-align:center;padding:30px;color:#888;font-size:13px}
/* Form card */
.form-card{background:#fff;border-radius:12px;padding:24px;border:1px solid #e8eaed;margin-bottom:16px}
.form-card h3{font-size:15px;font-weight:500;margin-bottom:16px;color:#1a1a2e}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Report buttons */
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.report-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #e8eaed;text-align:center}
.report-card .icon{font-size:32px;margin-bottom:12px}
.report-card h3{font-size:14px;font-weight:500;margin-bottom:6px;color:#1a1a2e}
.report-card p{font-size:12px;color:#888;margin-bottom:14px}
.report-btns{display:flex;gap:8px;justify-content:center}
/* Notification dot */
.dot{width:8px;height:8px;background:#ea4335;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
    <div>
      <h1>📦 Device Inventory System</h1>
      <div class="sub">TRANSSION Holdings</div>
    </div>
  </div>
  <div id="headerRight"></div>
</div>

<div class="container" id="app"></div>

<script>
const API = 'https://feishu-device-inventory-production.up.railway.app';
let TOKEN = localStorage.getItem('inv_token');
let USER  = JSON.parse(localStorage.getItem('inv_user') || 'null');
let pageStack = [];

// ── helpers ──────────────────────────────────────────────────────────────────
async function req(method, path, body, isForm) {
  const opts = { method, headers: { Authorization: `Bearer ${TOKEN}` } };
  if (body && !isForm) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (isForm) opts.body = body;
  const r = await fetch(API + path, opts);
  return r.json();
}

function statusPill(s) {
  const map = { New:'pill-new', Available:'pill-available', Assigned:'pill-assigned',
    Returned:'pill-returned', Damaged:'pill-damaged', Scrapped:'pill-scrapped',
    Pending:'pill-pending', Approved:'pill-approved', Rejected:'pill-rejected',
    'Low stock':'pill-damaged', 'Out of stock':'pill-scrapped', 'In stock':'pill-available' };
  return `<span class="status-pill ${map[s]||'pill-new'}">${s||'—'}</span>`;
}

function badgeClass(role) {
  return { Admin:'badge-admin', TL:'badge-tl', InventoryHolder:'badge-inv', Employee:'badge-emp' }[role] || 'badge-emp';
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(typeof ts === 'number' ? ts : ts);
  if (isNaN(d)) return '—';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = months[d.getMonth()];
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}-${mm}-${yy}`;
}

function show(html) { document.getElementById('app').innerHTML = html; }

function fv(f,key){const v=f[key];if(!v)return '';if(typeof v==='string')return v;if(typeof v==='number')return String(v);if(Array.isArray(v))return v.map(x=>x?.text||x).filter(Boolean).join(', ');if(v.text)return v.text;return String(v);}
function fvs(f,key){const v=f[key];if(!v)return '';if(typeof v==='string')return v;if(Array.isArray(v))return v[0]?.text||v[0]||'';if(v.text)return v.text;return String(v);}
function navigate(page, push = true) {
  if (push) {
    if (pageStack[pageStack.length-1] !== page) pageStack.push(page);
  }
  const btn = document.getElementById('backBtn');
  btn.classList.toggle('show', page !== 'dashboard');
  renderPage(page);
}

function goBack() {
  pageStack.pop();
  const prev = pageStack[pageStack.length - 1] || 'dashboard';
  navigate(prev, false);
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function renderLogin() {
  pageStack = [];
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('headerRight').innerHTML = '';
  show(`
    <div class="login-wrap">
      <div class="welcome-box">
        <div style="font-size:48px;margin-bottom:12px">📦</div>
        <h2>Welcome to Device Inventory</h2>
        <p>TRANSSION Holdings — Sign in with your Employee ID</p>
      </div>
      <div class="login-box">
        <h2>Sign In</h2>
        <div class="alert" id="err"></div>
        <div class="form-group"><label>Employee ID</label>
          <input id="empId" placeholder="e.g. ADMIN001" /></div>
        <div class="form-group"><label>Password</label>
          <input id="pw" type="password" placeholder="Enter your password" /></div>
        <button class="btn btn-full" id="loginBtn" onclick="doLogin()">Sign In</button>
      </div>
    </div>`);
  document.getElementById('empId').addEventListener('keydown', e => e.key==='Enter' && doLogin());
  document.getElementById('pw').addEventListener('keydown', e => e.key==='Enter' && doLogin());
}

async function doLogin() {
  const empId = document.getElementById('empId').value.trim();
  const pw    = document.getElementById('pw').value;
  const err   = document.getElementById('err');
  const btn   = document.getElementById('loginBtn');
  err.className = 'alert'; err.style.display = 'none';
  if (!empId||!pw) { showErr(err,'Please enter Employee ID and password'); return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const d = await req('POST','/api/auth/login',{employeeId:empId, password:pw});
    if (d.success) {
      TOKEN = d.token; USER = d.user;
      localStorage.setItem('inv_token', TOKEN);
      localStorage.setItem('inv_user', JSON.stringify(USER));
      renderDashboard();
    } else { showErr(err, d.message || 'Invalid credentials'); }
  } catch(e) { showErr(err,'Cannot connect to server. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Sign In';
}

function showErr(el, msg) { el.textContent = msg; el.className = 'alert alert-error'; }
function showOk(el, msg)  { el.textContent = msg; el.className = 'alert alert-success'; }

function logout() {
  localStorage.clear(); TOKEN = null; USER = null;
  renderLogin();
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  pageStack = ['dashboard'];
  document.getElementById('backBtn').classList.remove('show');
  document.getElementById('headerRight').innerHTML =
    `<div style="text-align:right;font-size:12px;color:rgba(255,255,255,.9)">
      ${USER.fullName}<br><button onclick="logout()" style="background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:11px">Sign out</button>
    </div>`;

  const MENUS = {
    Admin: [
      {i:'📋',c:'c-blue',  t:'All Inventory',   d:'View & manage devices',       p:'inventory'},
      {i:'⬆️',c:'c-green', t:'Bulk Upload',      d:'Upload devices via Excel',    p:'upload'},
      {i:'➕',c:'c-teal',  t:'Add Single Device', d:'Add one device manually',    p:'addinventory'},
      {i:'📊',c:'c-purple',t:'Dashboard Stats',  d:'Overview & analytics',        p:'stats'},
      {i:'📝',c:'c-orange',t:'All Requests',     d:'View device requests',        p:'requests'},
      {i:'👥',c:'c-teal',  t:'Manage Users',     d:'Register & manage employees', p:'users'},
      {i:'📁',c:'c-blue',  t:'Reports',          d:'Export Excel/CSV reports',    p:'reports'},
      {i:'🔍',c:'c-red',   t:'Audit Log',        d:'Full activity history',       p:'audit'},
      {i:'⚠️',c:'c-orange',t:'Duplicate Log',    d:'Blocked duplicate entries',   p:'duplog'},
      {i:'🏆',c:'c-purple',t:'Benchmark Inventory',d:'Competitor devices (restricted)',p:'benchmark'},
    ],
    TL: [
      {i:'✅',c:'c-green', t:'Approve Requests', d:'Review pending requests',     p:'approve'},
      {i:'📋',c:'c-blue',  t:'Team Inventory',   d:'View team devices',           p:'inventory'},
      {i:'↩️',c:'c-orange',t:'Returns',          d:'Track device returns',        p:'returns'},
      {i:'📊',c:'c-purple',t:'Dashboard Stats',  d:'Overview & analytics',        p:'stats'},
      {i:'📁',c:'c-teal',  t:'Reports',          d:'Export team reports',         p:'reports'},
    ],
    InventoryHolder: [
      {i:'📋',c:'c-blue',  t:'All Inventory',    d:'View & manage devices',       p:'inventory'},
      {i:'⬆️',c:'c-green', t:'Bulk Upload',      d:'Upload devices via Excel',    p:'upload'},
      {i:'➕',c:'c-teal',  t:'Add Single Device', d:'Add one device manually',    p:'addinventory'},
      {i:'✅',c:'c-teal',  t:'Validate Returns', d:'Confirm returned devices',    p:'returns'},
      {i:'📊',c:'c-purple',t:'Stock Overview',   d:'Check availability',          p:'stats'},
      {i:'🏆',c:'c-purple',t:'Benchmark Inventory',d:'Competitor devices',         p:'benchmark'},
    ],
    BenchmarkViewer: [
      {i:'🏆',c:'c-purple',t:'Benchmark Inventory',d:'Competitor devices',         p:'benchmark'},
      {i:'📊',c:'c-blue',  t:'Benchmark Stats',  d:'Overview by brand/category',  p:'benchstats'},
    ],
    Employee: [
      {i:'📱',c:'c-blue',  t:'My Devices',       d:'Devices assigned to you',     p:'mydevices'},
      {i:'➕',c:'c-green', t:'Request Device',   d:'Submit a device request',     p:'newrequest'},
      {i:'↩️',c:'c-orange',t:'Return Device',    d:'Submit a return request',     p:'newreturn'},
      {i:'🔔',c:'c-purple',t:'My Requests',      d:'Track request status',        p:'myrequests'},
    ],
  };

  const menus = MENUS[USER.role] || MENUS.Employee;
  show(`
    <div class="status-bar">
      <div>
        <div class="status-name">${USER.fullName}</div>
        <div class="status-info">${USER.department||''} · ${USER.employeeId}</div>
      </div>
      <span class="badge ${badgeClass(USER.role)}">${USER.role}</span>
    </div>
    <div class="section-title">Quick Actions</div>
    <div class="grid-2">${menus.map(m=>`
      <div class="card" onclick="navigate('${m.p}')">
        <div class="card-icon ${m.c}">${m.i}</div>
        <div class="card-title">${m.t}</div>
        <div class="card-desc">${m.d}</div>
      </div>`).join('')}
    </div>`);
}

// ── Inventory ─────────────────────────────────────────────────────────────────
async function renderInventory() {
  show(`<div class="loading">Loading inventory...</div>`);
  const assignedTo = USER.role === 'Employee' ? USER.employeeId : '';
  const d = await req('GET', `/api/inventory?pageSize=100${assignedTo?'&assignedTo='+assignedTo:''}`);
  const items = d.items || [];
  show(`
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">📋 Inventory (${items.length})</div>
        <div class="search-row">
          <input class="search-input" id="invSearch" placeholder="Search brand, model, IMEI..." oninput="filterTable('invTbl',this.value)">
          <select class="filter-select" onchange="filterByStatus('invTbl',this.value)">
            <option value="">All Status</option>
            <option>New</option><option>Available</option><option>Assigned</option>
            <option>Returned</option><option>Damaged</option><option>Scrapped</option>
          </select>
          ${USER.role!=='Employee'?`<button class="btn btn-sm btn-green" onclick="navigate('upload')">⬆ Upload</button>`:''}
        </div>
      </div>
      <div style="overflow-x:auto">
      <table id="invTbl">
        <thead><tr>
          <th>Brand/Model</th><th>IMEI1</th><th>HW Stage</th>
          <th>Location</th><th>Status</th><th>Assigned To</th><th>Return Date</th><th>Photo</th>
        </tr></thead>
        <tbody>${items.length ? items.map(i=>{
          const f=i.fields||{};
          const brand=i.brand||fv(f,'Brand')||'—';
          const model=i.deviceModel||fv(f,'Device Model')||'';
          const imei1=i.imei1||fv(f,'IMEI1')||'—';
          const stage=i.hwStage||fv(f,'HW Stage')||'—';
          const loc=i.warehouseLocation||fv(f,'Warehouse / Location')||'—';
          const stat=i.deviceStatus||fvs(f,'Device Status')||'—';
          const asgn=i.assignedTo||fv(f,'Assigned To')||'—';
          const ret=i.expectedReturnDate||f['Expected Return Date']||null;
          return `<tr data-status="${stat}">
            <td><div style="font-weight:500">${brand}</div><div style="font-size:12px;color:#888">${model}</div></td>
            <td style="font-family:monospace;font-size:12px">${imei1}</td>
            <td>${stage}</td><td>${loc}</td>
            <td>${statusPill(stat)}</td><td>${asgn}</td>
            <td>${fmtDate(ret)}</td></tr>`;}).join('') : '<tr><td colspan="7" class="empty">No devices found</td></tr>'}
        </tbody>
      </table>
      </div>
    </div>`);
}

function filterTable(tableId, q) {
  const rows = document.querySelectorAll(`#${tableId} tbody tr`);
  q = q.toLowerCase();
  rows.forEach(r => r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none');
}

function filterByStatus(tableId, s) {
  const rows = document.querySelectorAll(`#${tableId} tbody tr`);
  rows.forEach(r => r.style.display = (!s || r.dataset.status === s) ? '' : 'none');
}

// ── Stats ─────────────────────────────────────────────────────────────────────
async function renderStats() {
  show(`<div class="loading">Loading dashboard...</div>`);
  const d = await req('GET', '/api/inventory/dashboard');
  const s = d.data || {};
  const bs = s.byStatus || {};
  show(`
    <div class="page-title">📊 Dashboard Stats</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Devices</div><div class="stat-value">${s.total||0}</div></div>
      <div class="stat-card"><div class="stat-label">Assigned</div><div class="stat-value" style="color:#b45309">${bs.Assigned||0}</div></div>
      <div class="stat-card"><div class="stat-label">Available</div><div class="stat-value" style="color:#137333">${bs.Available||0}</div></div>
      <div class="stat-card"><div class="stat-label">Overdue</div><div class="stat-value" style="color:#c62828">${s.overdueCount||0}</div></div>
    </div>
    <div class="grid-2">
      <div class="form-card">
        <h3>By Status</h3>
        ${Object.entries(bs).map(([k,v])=>`
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0">
            <span>${statusPill(k)}</span><strong>${v}</strong>
          </div>`).join('')}
      </div>
      <div class="form-card">
        <h3>By Brand</h3>
        ${Object.entries(s.byBrand||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`

      </div>
      <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="handleDrop(event)">
        <div class="upload-icon">📁</div>

        <div class="upload-sub">Supports .xlsx and .csv files</div>

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) uploadFile(f);
}

async function uploadFile(file) {
  if (!file) return;
  const res = document.getElementById('uploadResult');
  res.innerHTML = `<div class="loading">⏳ Uploading and validating ${file.name}...</div>`;
  const fd = new FormData(); fd.append('file', file);
  try {
    const d = await req('POST', '/api/inventory/bulk-upload', fd, true);
    if (d.success) {
      const s = d.summary;
      res.innerHTML = `
        <div class="form-card">
          <h3>✅ Upload Complete — Batch: ${s.batchId}</h3>
          <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
            <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${s.total}</div></div>
            <div class="stat-card"><div class="stat-label">Success</div><div class="stat-value" style="color:#137333">${s.success}</div></div>
            <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value" style="color:#c62828">${s.failed}</div></div>
            <div class="stat-card"><div class="stat-label">Duplicates</div><div class="stat-value" style="color:#b45309">${s.duplicates}</div></div>
            <div class="stat-card"><div class="stat-label">Missing Data</div><div class="stat-value" style="color:#888">${s.missingData}</div></div>
          </div>
          ${s.errors?.length ? `<div style="margin-top:12px"><strong style="font-size:13px">Failed rows:</strong>
            <div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>Row</th><th>Reason</th></tr></thead>
            <tbody>${s.errors.map(e=>`<tr><td>${e.row}</td><td style="color:#c62828">${e.reason}</td></tr>`).join('')}</tbody></table></div>
          </div>`:''}
        </div>`;
    } else {
      res.innerHTML = `<div class="alert alert-error">${d.message||'Upload failed'}</div>`;
    }
  } catch(e) {
    res.innerHTML = `<div class="alert alert-error">Upload failed. Please try again.</div>`;
  }
}

async function showApproveModal(reqId, empName, device) {
  const inv = await req('GET', '/api/inventory?status=Available&pageSize=50');
  const available = (inv.items||[]).filter(i=>['New','Available','Returned'].includes(i.deviceStatus));
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:24px;width:100%;max-width:480px">
      <h3 style="font-size:15px;font-weight:500;margin-bottom:4px">Approve Request</h3>
      <p style="font-size:13px;color:#888;margin-bottom:16px">For ${empName} — ${device}</p>
      <div id="approveErr" class="alert"></div>
      <div class="form-group"><label>Select Device to Assign</label>
        <select id="selDevice" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:13px">
          <option value="">— Choose an available device —</option>
          ${available.map(d=>`<option value="${d.recordId}">${d.brand} ${d.deviceModel} — IMEI: ${d.imei1} (${d.deviceStatus})</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Expected Return Date</label>
        <input type="date" id="retDate" style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px">
      </div>
      <div class="form-group"><label>Remarks (optional)</label>
        <input id="approveRemarks" placeholder="Any notes..." style="width:100%;height:40px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="this.closest('div[style]').remove()">Cancel</button>
        <button class="btn btn-green" onclick="doApprove('${reqId}',this.closest('div[style]'))">Approve & Assign</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function doApprove(reqId, modal) {
  const devId = document.getElementById('selDevice').value;
  const retDate = document.getElementById('retDate').value;
  const remarks = document.getElementById('approveRemarks').value;
  const err = document.getElementById('approveErr');
  if (!devId) { showErr(err,'Please select a device'); return; }
  if (!retDate) { showErr(err,'Please set a return date'); return; }
  const d = await req('POST', `/api/requests/${reqId}/approve`, { inventoryRecordId: devId, expectedReturnDate: retDate, remarks });
  if (d.success) { modal.remove(); navigate('requests', false); renderRequests(); }
  else showErr(err, d.message || 'Approval failed');
}

async function rejectRequest(reqId) {
  const reason = prompt('Rejection reason:');
  if (!reason) return;
  const d = await req('POST', `/api/requests/${reqId}/reject`, { reason });
  if (d.success) renderRequests();
  else alert(d.message || 'Failed to reject');
}

async function uploadBenchFile(file) {
  if (!file) return;
  const res = document.getElementById('benchUploadResult');
  res.innerHTML = `<div class="loading">⏳ Uploading ${file.name}...</div>`;
  const fd = new FormData(); fd.append('file', file);
  try {
    const d = await req('POST', '/api/benchmark/bulk-upload', fd, true);
    if (d.success) {
      const s = d.summary;
      res.innerHTML = `<div class="form-card"><h3>✅ Upload Complete — ${s.batchId}</h3>
        <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">${s.total}</div></div>
          <div class="stat-card"><div class="stat-label">Success</div><div class="stat-value" style="color:#137333">${s.success}</div></div>
          <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value" style="color:#c62828">${s.failed}</div></div>
        </div>
        ${s.errors?.length ? `<div style="margin-top:12px"><strong>Errors:</strong><br>${s.errors.map(e=>`Row ${e.row}: ${e.reason}`).join('<br>')}</div>`:''}
      </div>`;
    } else { res.innerHTML = `<div class="alert alert-error">${d.message||'Upload failed'}</div>`; }
  } catch(e) { res.innerHTML = `<div class="alert alert-error">Upload failed. Please try again.</div>`; }
}

async function saveNewInventory() {
  const msg   = document.getElementById('addInvMsg');
  const brand = document.getElementById('aiBrand').value;
  const model = document.getElementById('aiModel').value.trim();
  const hwType= document.getElementById('aiHwType').value;
  const imei1 = document.getElementById('aiImei1').value.trim();
  const color = document.getElementById('aiColor').value.trim();
  const storage=document.getElementById('aiStorage').value.trim();
  const loc   = document.getElementById('aiLoc').value.trim();
  const holder= document.getElementById('aiHolder').value.trim();

  if (!brand||!model||!hwType||!color||!storage||!loc||!holder) {
    showErr(msg,'Please fill all mandatory fields (*)'); return;
  }
  if (imei1 && imei1.length !== 15) { showErr(msg,'IMEI1 must be exactly 15 digits'); return; }
  const imei2 = document.getElementById('aiImei2').value.trim();
  if (imei2 && imei2.length !== 15) { showErr(msg,'IMEI2 must be exactly 15 digits'); return; }

  const dateVal = document.getElementById('aiDate').value;
  const d = await req('POST', '/api/inventory', {
    brand, deviceModel: model, sampleHwType: hwType,
    hwStage: document.getElementById('aiStage').value,
    imei1, imei2,
    vcId: document.getElementById('aiVcId').value.trim(),
    color, storageRamVariant: storage,
    sampleReceivedDate: dateVal ? new Date(dateVal).getTime() : null,
    warehouseLocation: loc, inventoryHolder: holder,
    remarks: document.getElementById('aiRemarks').value,
  });
  if (d.success) {
    showOk(msg,'✅ Device added! You can now upload a photo for it.');
    // Reset form
    ['aiBrand','aiHwType','aiStage'].forEach(id => document.getElementById(id).value = '');
    ['aiModel','aiImei1','aiImei2','aiVcId','aiColor','aiStorage','aiDate','aiLoc','aiHolder','aiRemarks']
      .forEach(id => document.getElementById(id).value = '');
    setTimeout(() => navigate('inventory'), 2500);
  } else showErr(msg, d.message || 'Failed to add device');
}

  modal.innerHTML = `

      <h3 style="font-size:15px;font-weight:500;margin-bottom:4px">📷 Upload Device Photo</h3>
      <p style="font-size:13px;color:#888;margin-bottom:16px">Photo will be saved directly in Feishu Bitable</p>
      <div id="imgErr" class="alert" style="display:none"></div>

      <div id="imgDropZone" style="border:2px dashed #ddd;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px"
        onclick="document.getElementById('imgFileInput').click()"
        ondragover="event.preventDefault();this.style.borderColor='#1a73e8'"
        ondragleave="this.style.borderColor='#ddd'"
        ondrop="handleImgDrop(event,'${endpoint}')">
        <div style="font-size:40px;margin-bottom:8px">📸</div>
        <div style="font-weight:500;margin-bottom:4px">Click to select photo</div>
        <div style="font-size:12px;color:#888">JPG, PNG, WEBP — max 10MB</div>
        <div id="imgPreviewWrap" style="margin-top:12px;display:none">
          <img id="imgPreview" style="max-width:100%;max-height:160px;border-radius:8px;border:1px solid #eee">
          <div id="imgFileName" style="font-size:12px;color:#666;margin-top:6px"></div>
        </div>
      </div>

      <input type="file" id="imgFileInput" accept="image/*" capture="environment" style="display:none"
        onchange="previewImg(this,'${endpoint}')">

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="document.getElementById('imgModal').remove()">Cancel</button>
        <button class="btn" id="imgUploadBtn" onclick="doUploadImg('${endpoint}')" disabled>📤 Upload Photo</button>
      </div>
      <div id="imgProgress" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:#1a73e8">
        ⏳ Uploading to Feishu...
      </div>
      <div id="imgSuccess" style="display:none;margin-top:12px;text-align:center;font-size:13px;color:#137333">
        ✅ Photo saved to Feishu Bitable!
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

let _imgFile = null;

function previewImg(input, endpoint) {
  const file = input.files[0];
  if (!file) return;
  _imgFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('imgPreview').src = e.target.result;
    document.getElementById('imgFileName').textContent = `${file.name} (${(file.size/1024).toFixed(0)} KB)`;
    document.getElementById('imgPreviewWrap').style.display = 'block';
    document.getElementById('imgUploadBtn').disabled = false;
    document.getElementById('imgDropZone').style.borderColor = '#1a73e8';
  };
  reader.readAsDataURL(file);
}

function handleImgDrop(e, endpoint) {
  e.preventDefault();
  document.getElementById('imgDropZone').style.borderColor = '#ddd';
  const file = e.dataTransfer.files[0];
  if (!file) return;
  // Simulate input change
  const dt = new DataTransfer();
  dt.items.add(file);
  const input = document.getElementById('imgFileInput');
  input.files = dt.files;
  previewImg(input, endpoint);
}

async function doUploadImg(endpoint) {
  if (!_imgFile) return;
  const btn      = document.getElementById('imgUploadBtn');
  const progress = document.getElementById('imgProgress');
  const success  = document.getElementById('imgSuccess');
  const err      = document.getElementById('imgErr');

  btn.disabled = true;
  progress.style.display = 'block';
  err.style.display = 'none';

  try {
    const fd = new FormData();
    fd.append('image', _imgFile);
    const res = await fetch(API + endpoint, {
      method: 'POST',
      headers: { Authorization: `Bearer ${TOKEN}` },
      body: fd,
    });
    const data = await res.json();
    progress.style.display = 'none';
    if (data.success) {
      success.style.display = 'block';
      _imgFile = null;
      setTimeout(() => {
        document.getElementById('imgModal')?.remove();
      }, 2000);
    } else {
      showErr(err, data.message || 'Upload failed');
      btn.disabled = false;
    }
  } catch(e) {
    progress.style.display = 'none';
    showErr(err, 'Upload failed. Please try again.');
    btn.disabled = false;
  }
}
